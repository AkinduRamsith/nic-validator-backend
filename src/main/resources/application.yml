server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: mint-invoiz-backend
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/mint_invoiz_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:mint_user}
    password: ${DB_PASSWORD:mint_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mintinvoiz-super-secret-key-change-in-production-2024}
  access-token-expiration: 900000 # 15 minutes
  refresh-token-expiration: 604800000 # 7 days

# File Storage Configuration
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size: 10MB

# Invoice Configuration
invoice:
  default-prefix: MI
  pdf:
    watermark:
      text: "Generated by Mint Invoiz"
      enabled: true
  quota:
    free: 25
    elite: 100
    pro: 500
    ultra: -1 # unlimited

# Payment Gateway Configuration (Placeholders)
payment:
  stripe:
    public-key: ${STRIPE_PUBLIC_KEY:}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    mode: ${PAYPAL_MODE:sandbox}

# SMS Configuration
sms:
  provider: ${SMS_PROVIDER:twilio}
  api-key: ${SMS_API_KEY:}
  api-secret: ${SMS_API_SECRET:}
  from-number: ${SMS_FROM_NUMBER:}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://mintinvoiz.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging
logging:
  level:
    org.oxy12.mintinvoiz: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Application Info
info:
  app:
    name: Mint Invoiz Backend
    description: Invoice Management System by OXY12
    version: 1.0.0
    company: OXY12
    website: https://mintinvoiz.com